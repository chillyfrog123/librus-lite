[package]
name = "klaso-desktop"
version = "0.6.1"
edition = "2021"

[dependencies]
anyhow = "1"
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6", features = ["windows-native"] }
zeroize = "1"
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.22"
html-escape = "0.2"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
